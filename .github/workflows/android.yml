name: Android app

# Builds the free Wishwell Android app for Google Play from android-app/.
# Output: a release bundle (.aab) for Play, a debug .apk to try on a phone,
# and the Play Store screenshots and feature graphic.
# The bundle is signed with the upload key only when the four WISHWELL_UPLOAD_* secrets exist.

on:
  push:
    branches: [android-app]
    paths:
      - "android-app/**"
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Count new starter ideas since the last release
        run: node scripts/count-new-ideas.mjs

      - name: Read the version (release/version.json)
        id: ver
        run: |
          echo "code=$(jq -r .code release/version.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name release/version.json)" >> "$GITHUB_OUTPUT"

      - name: Make the free app files and copy them into Android
        run: npm run sync

      - name: Load the upload key
        env:
          KEYSTORE_B64: ${{ secrets.WISHWELL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "WISHWELL_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "No upload key secrets yet, so the bundle will be unsigned."
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android-app/android
        env:
          WISHWELL_VERSION_CODE: ${{ steps.ver.outputs.code }}
          WISHWELL_VERSION_NAME: ${{ steps.ver.outputs.name }}
          WISHWELL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.WISHWELL_UPLOAD_KEYSTORE_PASSWORD }}
          WISHWELL_UPLOAD_KEY_ALIAS: ${{ secrets.WISHWELL_UPLOAD_KEY_ALIAS }}
          WISHWELL_UPLOAD_KEY_PASSWORD: ${{ secrets.WISHWELL_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Check native libraries for 16 KB pages
        run: |
          (cd android && ./gradlew --no-daemon -q app:dependencies --configuration releaseRuntimeClasspath | grep -i "mediapipe" | head -5) || true
          python3 scripts/check-16kb.py android/app/build/outputs/bundle/release/app-release.aab

      - name: Name the files
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/wishwell-${{ steps.ver.outputs.code }}-$([ "$SIGNED" = yes ] && echo signed || echo UNSIGNED).aab"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/wishwell-${{ steps.ver.outputs.code }}-debug.apk"
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: wishwell-android-${{ steps.ver.outputs.code }}-build-${{ github.run_number }}
          path: android-app/out/
          retention-days: 30

  store-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - run: npm ci
      - run: npm run build:web
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node tools/store-images.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wishwell-store-images-${{ github.run_number }}
          path: |
            android-app/store/
