<script>
/* Public copy of the beta's Holiday Games (beta/advent). Keep the two in step.
   buyUrl: the Games Pass checkout link (blank = "coming soon"). rewards: bonus AI rounds, off here for now. */
WishwellAdvent.mount(document.getElementById("advent"),{backHref:"../",backLabel:"Wishwell",showPreview:false,

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
</script>
<script src="../count.js" defer></script>
