name = "wishwell-ai-ideas"
main = "worker.js"
compatibility_date = "2025-01-01"

# Workers AI. Free plan: 10,000 Neurons a day, shared by every model on the account.
[ai]
binding = "AI"

[vars]
# Any free plan text model works. Change this line to try another one.
MODEL = "@cf/zai-org/glm-4.7-flash"
# Only this site may call the Worker.
ALLOWED_ORIGINS = "https://shopmysticstudio.github.io"
# "true": every request needs the beta code. Set to "false" when AI goes public on /app.
BETA_ONLY = "true"
# Free trial: AI rounds per device, and most trial rounds per IP address per day.
TRIAL_ROUNDS = "3"
TRIAL_PER_IP = "6"
# Holiday Pass: AI rounds per pass per day (UTC).
PASS_DAILY = "25"
# "off" stops saving ideas to the pool.
POOL = "on"
# GUMROAD_PRODUCT_ID is set as a Secret in the Cloudflare dashboard, not here.

# Trial counts, pass checks and the idea pool.
[[kv_namespaces]]
binding = "KV"
id = "9e7e866afc6e4d1ca50c4a86f30169e7"

# Per visitor limit: 5 requests a minute. namespace_id can be any number not used by another limit.
[[ratelimits]]
name = "PER_MINUTE"
namespace_id = "1101"
simple = { limit = 5, period = 60 }
