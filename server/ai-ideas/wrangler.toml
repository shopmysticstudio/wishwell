name = "wishwell-ai-ideas"
main = "worker.js"
compatibility_date = "2025-01-01"

# Workers AI. Free plan: 10,000 Neurons a day, shared by every model on the account.
[ai]
binding = "AI"

[vars]
# Any free plan text model works. Change this line to try another one.
# GLM 4.7 Flash was too slow here (it kept thinking, 2 to 5 minutes a round), so Llama 3.3 70B Fast.
# About 150 Neurons a round, so the free 10,000 a day covers about 60 rounds.
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Tried when the main model is slow (AI_TIMEOUT_MS) or its reply is unusable. "off" turns it off.
BACKUP_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
AI_TIMEOUT_MS = "20000"
BACKUP_TIMEOUT_MS = "25000"
# Only this site may call the Worker.
ALLOWED_ORIGINS = "https://shopmysticstudio.github.io"
# The Android app's WebView origin. It may only call /verify, /signal and pass rounds (x-pass-key); no free trial.
APP_ORIGINS = "https://localhost"
# "true": every request needs the beta code. "false": AI is open on the public site too.
BETA_ONLY = "false"
# Free AI rounds per device (x-device-id), counted in D1. People on the same Wi-Fi each get their own.
# Public site: free AI rounds a day per device (TRIAL_WEEKLY "0" = no weekly cap). A day starts at midnight US Eastern
# (5 AM UTC); a week starts Monday.
TRIAL_DAILY = "6"
TRIAL_WEEKLY = "0"
TRIAL_DAY_START_HOUR_UTC = "5"
# Per-network caps, off. If one network abuses the free rounds, set these to numbers
# (for example "6" and "30") to cap that network's free rounds a day and a week.
TRIAL_NET_DAILY = "off"
TRIAL_NET_WEEKLY = "off"
# Free and beta-code rounds for everyone together, a day. Past this the site shows starter ideas
# until tomorrow, so the free Workers AI allowance (10,000 Neurons a day, about 60 rounds) always
# has room left for Holiday Pass rounds.
TRIAL_GLOBAL_DAILY = "40"
# Test runs ({"dry": true}, beta code only, nothing saved) a day, for everyone together. They also
# count toward TRIAL_GLOBAL_DAILY. Kept small so tests never eat the free AI that live rounds need.
DRY_DAILY = "5"
# Gift map scores for new ideas: "night" (default) scores them in the nightly job with leftover daily
# AI only; "live" scores when someone opens the map (this used about a quarter of a day's free AI on
# Nov 28); "off" stops scoring.
MAP_SCORE = "night"
# Older lifetime limit, only used if TRIAL_DAILY and TRIAL_WEEKLY are removed.
TRIAL_ROUNDS = "3"
TRIAL_PER_NETWORK = "off"
TRIAL_NETWORK_DAYS = "30"
# People with the beta code get this many per device instead (counted separately).
BETA_ROUNDS = "30"
BETA_PER_NETWORK = "off"
# Only used if the DB binding is removed (KV fallback): trial rounds per IP per day.
TRIAL_PER_IP = "6"
# Holiday Pass: AI rounds per key a day and a week (same day and week start as above), shared
# by all of a key's devices; how many devices one key works on; wrong key or email tries allowed
# per network per day.
PASS_DAILY = "25"
PASS_WEEKLY = "100"
PASS_DEVICES = "3"
PASS_BAD_TRIES = "10"
# "Notify me at launch" sign-ups allowed per network a day (the list is in D1, table waitlist).
WAITLIST_PER_NETWORK = "5"
# Shared discount codes: adds and votes per device a day. Limits are per device, not per Wi-Fi
# network. If one network abuses it, set CODES_NET_PER_DAY to a number to cap adds from a network.
CODES_ADDS_PER_DAY = "8"
CODES_VOTES_PER_DAY = "60"
CODES_NET_PER_DAY = "off"
# "off" stops saving ideas to the pool.
POOL = "on"
# Leftover-AI gap filling (see [triggers]): "off" turns it off. Neurons kept back for live rounds, about
# what one word costs, most words a night, and how many phones must report a word first.
GAP_FILL = "on"
GAP_MARGIN = "3000"
GAP_COST = "150"
GAP_TERMS = "6"
GAP_MIN = "2"
# Holiday Games (/advent): a level's first win earns one bonus AI round, spent once the free rounds
# are used up (it still takes a TRIAL_GLOBAL_DAILY slot). "off" turns rewards off. Levels above
# GAMES_FREE_LEVELS need a Games Pass or Holiday Pass. Bonus rounds per device a day, for everyone
# together a day, the most one device can hold, and how many days they last from the first one.
REWARDS = "on"
GAMES_FREE_LEVELS = "4"
REWARD_DAILY = "3"
REWARD_GLOBAL_DAILY = "300"
BONUS_MAX = "10"
BONUS_DAYS = "60"
# GUMROAD_PRODUCT_ID is set as a Secret in the Cloudflare dashboard, not here.
# GAMES_PRODUCT_ID (optional, the Games Pass product) is a Secret too. Unset: only Holiday Pass keys
# open the paid levels.

# Trial counts, pass checks and the idea pool.
[[kv_namespaces]]
binding = "KV"
id = "9e7e866afc6e4d1ca50c4a86f30169e7"

# Per visitor limit: 5 requests a minute. namespace_id can be any number not used by another limit.
[[ratelimits]]
name = "PER_MINUTE"
namespace_id = "1101"
simple = { limit = 5, period = 60 }

# Page counter (/hit): page views and button clicks from one network, a minute. Nothing is stored for this.
[[ratelimits]]
name = "HITS"
namespace_id = "1102"
simple = { limit = 30, period = 60 }

# Shared discount codes (/codes): requests from one device a minute.
[[ratelimits]]
name = "CODES"
namespace_id = "1103"
simple = { limit = 20, period = 60 }

# Beta: before the free AI allowance resets (00:00 UTC, 7 PM US Eastern), write pool ideas for words
# phones reported as unmatched, using only what's left of the day after GAP_MARGIN Neurons for live rounds.
[triggers]
crons = ["25 23 * * *"]

# Idea pool in D1 (anonymous idea text and counts; tables in migrations/).
# Remove this block to go back to the KV pool.
[[d1_databases]]
binding = "DB"
database_name = "wishwell-ideas"
database_id = "43981f5d-4653-4ec4-8261-0b493b3020a8"
migrations_dir = "migrations"
