name = "wishwell-ai-ideas"
main = "worker.js"
compatibility_date = "2025-01-01"

# Workers AI. Free plan: 10,000 Neurons a day, shared by every model on the account.
[ai]
binding = "AI"

[vars]
# Any free plan text model works. Change this line to try another one.
MODEL = "@cf/zai-org/glm-4.7-flash"
# Only this site may call the Worker.
ALLOWED_ORIGINS = "https://shopmysticstudio.github.io"
# Most AI rounds one visitor gets per day. Only used if the LIMITS KV namespace below is set up.
DAILY_PER_IP = "30"

# Per visitor limit: 5 AI rounds a minute. namespace_id can be any number not used by another limit.
[[ratelimits]]
name = "PER_MINUTE"
namespace_id = "1101"
simple = { limit = 5, period = 60 }

# Optional daily cap per visitor. To turn it on, run:
#   npx wrangler kv namespace create LIMITS
# then remove the # from the three lines below and paste the id it prints.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "PASTE_THE_ID_HERE"
